<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BookNook - SIT725 Week 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="teal darken-2 center-align" style="padding: 40px 20px;">
      <h3 class="white-text">Welcome to BookNook</h3>
      <p class="white-text">A small library catalogue backed by MongoDB - SIT725 Task 4.2P</p>
      <a class="btn waves-effect waves-light teal darken-4 modal-trigger" href="#addBookModal">
        <i class="material-icons left">add</i>Add a Book
      </a>
    </div>
  </header>

  <main class="container">
    <div class="row" id="cardContainer" style="margin-top: 30px;">
      <!-- Book cards are injected here by scripts.js -->
    </div>
  </main>

  <!-- Add Book Modal -->
  <div id="addBookModal" class="modal">
    <div class="modal-content">
      <h4>Add a New Book</h4>
      <div class="row">
        <form class="col s12" id="addBookForm">
          <div class="row">
            <div class="input-field col s6">
              <input id="title" type="text" required>
              <label for="title">Title</label>
            </div>
            <div class="input-field col s6">
              <input id="author" type="text" required>
              <label for="author">Author</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s6">
              <input id="genre" type="text" required>
              <label for="genre">Genre</label>
            </div>
            <div class="input-field col s6">
              <input id="yearPublished" type="number" required>
              <label for="yearPublished">Year Published</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s6">
              <input id="coverImage" type="text" required>
              <label for="coverImage">Cover Image (path or URL)</label>
            </div>
            <div class="input-field col s6">
              <input id="rating" type="number" step="0.1" min="0" max="5">
              <label for="rating">Rating (0-5)</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12">
              <textarea id="description" class="materialize-textarea" required></textarea>
              <label for="description">Description</label>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="modal-footer">
      <a href="#!" id="formSubmit" class="modal-close waves-effect waves-green btn teal">Save Book</a>
      <a href="#!" class="modal-close waves-effect waves-red btn-flat">Cancel</a>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
